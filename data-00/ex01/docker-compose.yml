services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: piscineds_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword

    ports:
      - "8080:80"

    networks:
      - postgres_network

networks:
  postgres_network:
    external: true
    name: ex00_default