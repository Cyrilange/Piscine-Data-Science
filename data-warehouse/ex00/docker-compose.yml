services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: warehouse_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "8081:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - ex00_default

volumes:
  pgadmin_data:

networks:
  ex00_default:
    external: true